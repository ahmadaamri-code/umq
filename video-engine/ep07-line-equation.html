<div class="pre" style="font-weight:400">ميل a</div><div class="pre" style="font-weight:700">ميل a</div><div class="pre" style="font-weight:800">ميل a</div><div class="pre" style="font-weight:600">ميل a</div>

<script>
'use strict';
const W=1920,H=1080; const cv=document.getElementById('c'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
const K={paper:'#fbf5e6',ink:'#2b2925',muted:'#8a806f',grid:'#e7dcc5',axis:'#5d5447',rise:'#1f6fd1',run:'#d6453d',slope:'#14905a',
 pos:'#0f9d8a',neg:'#c2408a',zero:'#b08a12',undef:'#6b6b78',A:'#e0861a',B:'#7b4fd1',note:'#ffe98a',Q:'#7b4fd1',R:'#e0861a'};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const P=(t,a,b)=>ease(cl((t-a)/(b-a)));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const backE=x=>{x=cl(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const MI='−';
const fm=n=>{const r=Math.round(n*100)/100; return (Object.is(r,-0)?0:r).toString().replace('-',MI)};
const ISO=s=>'⁦'+s+'⁩';

/* ---------- text ---------- */
function ar(txt,x,y,size,col,{w=700,a=1,align='right'}={}){ if(a<=0) return; c.save(); c.globalAlpha*=a; c.direction='rtl'; c.textAlign=align; c.textBaseline='middle'; c.font=`${w} ${size}px Cairo`; c.fillStyle=col; c.fillText(txt,x,y); c.restore(); }
function arW(txt,size,w=700){ c.save(); c.direction='rtl'; c.font=`${w} ${size}px Cairo`; const m=c.measureText(txt).width; c.restore(); return m; }
// math rows: items {t,c,i(italic),b,sub,ar} or {fr:[row,row],c}
const v=(t,col)=>({t,c:col,i:1}), n=(t,col,b)=>({t,c:col,b}), sb=(t,col)=>({t,c:col,sub:1}), aw=(t,col)=>({t,c:col,ar:1}), F=(a,b,col)=>({fr:[a,b],c:col});
function fontFor(it,size){ if(it.ar) return `700 ${size*0.74}px Cairo`; const s=it.sub?size*0.62:size; return `${it.i?'italic ':''}${it.b?600:400} ${s}px "STIX Two Text"`; }
function mW(it,size){ if(it.fr) return Math.max(rowW(it.fr[0],size*.86),rowW(it.fr[1],size*.86))+size*0.42; c.save(); c.font=fontFor(it,size); c.direction=it.ar?'rtl':'ltr'; const w=c.measureText(it.t).width; c.restore(); return w+(it.i?size*0.04:0); }
function rowW(r,size){ return r.reduce((s,it)=>s+mW(it,size),0); }
function drawRow(r,x,y,size,a){ let cx=x; for(const it of r){ const w=mW(it,size);
  if(it.fr){ const s2=size*.86, nw=rowW(it.fr[0],s2), dw=rowW(it.fr[1],s2); drawRow(it.fr[0],cx+(w-nw)/2,y-size*0.58,s2,a); drawRow(it.fr[1],cx+(w-dw)/2,y+size*0.64,s2,a);
   c.save(); c.globalAlpha*=a; c.strokeStyle=it.c||K.ink; c.lineWidth=Math.max(2,size*0.055); c.lineCap='round'; c.beginPath(); c.moveTo(cx+size*0.12,y+size*0.04); c.lineTo(cx+w-size*0.12,y+size*0.04); c.stroke(); c.restore(); }
  else { c.save(); c.globalAlpha*=a; c.font=fontFor(it,size); c.fillStyle=it.c||K.ink; c.textBaseline='middle'; c.textAlign='left'; c.direction=it.ar?'rtl':'ltr'; if(it.ar){ c.textAlign='right'; c.fillText(it.t,cx+w,y+size*0.02); } else c.fillText(it.t,cx,y+(it.sub?size*0.28:0)); c.restore(); }
  cx+=w; } }
function row(r,x,y,size,{align='center',a=1}={}){ if(a<=0) return 0; const w=rowW(r,size); const lx=align==='center'?x-w/2:align==='right'?x-w:x; drawRow(r,lx,y,size,a); return w; }

/* ---------- shapes ---------- */
function arrow(x1,y1,x2,y2,col,w=6,head=20,a=1){ if(a<=0) return; const L=Math.hypot(x2-x1,y2-y1); if(L<1) return; const ang=Math.atan2(y2-y1,x2-x1); const hx=x2-Math.cos(ang)*head*0.8, hy=y2-Math.sin(ang)*head*0.8;
 c.save(); c.globalAlpha*=a; c.strokeStyle=col; c.fillStyle=col; c.lineWidth=w; c.lineCap='round'; c.beginPath(); c.moveTo(x1,y1); c.lineTo(hx,hy); c.stroke();
 if(L>head){ c.beginPath(); c.moveTo(x2,y2); c.lineTo(x2-head*Math.cos(ang-0.42),y2-head*Math.sin(ang-0.42)); c.lineTo(x2-head*Math.cos(ang+0.42),y2-head*Math.sin(ang+0.42)); c.closePath(); c.fill(); } c.restore(); }
function dotP(x,y,col,r=13,s=1,a=1){ if(s<=0||a<=0) return; c.save(); c.globalAlpha*=a; c.translate(x,y); c.scale(s,s); c.fillStyle=col; c.globalAlpha*=0.18; c.beginPath(); c.arc(0,0,r+12,0,7); c.fill(); c.globalAlpha/=0.18; c.fillStyle=col; c.strokeStyle='#fff'; c.lineWidth=4; c.beginPath(); c.arc(0,0,r,0,7); c.fill(); c.stroke(); c.restore(); }
function pill(x,y,w,h,fill,a=1,stroke){ c.save(); c.globalAlpha*=a; c.fillStyle=fill; c.beginPath(); c.roundRect(x,y,w,h,Math.min(h/2,22)); c.fill(); if(stroke){ c.strokeStyle=stroke; c.lineWidth=3; c.stroke(); } c.restore(); }
function card(x,y,w,h,a=1,col='#fffdf7'){ if(a<=0) return; c.save(); c.globalAlpha*=a; c.shadowColor='rgba(60,40,10,.18)'; c.shadowBlur=30; c.shadowOffsetY=10; c.fillStyle=col; c.beginPath(); c.roundRect(x,y,w,h,26); c.fill(); c.restore(); }
function G(ox,oy,u){ return {ox,oy,u,X:x=>ox+x*u,Y:y=>oy-y*u}; }
function grid(g,R,a=1,labels=true){ if(a<=0) return; c.save(); c.globalAlpha*=a; c.strokeStyle=K.grid; c.lineWidth=2; c.beginPath();
 for(let i=-R;i<=R;i++){ c.moveTo(g.X(i),g.Y(-R-.3)); c.lineTo(g.X(i),g.Y(R+.3)); c.moveTo(g.X(-R-.3),g.Y(i)); c.lineTo(g.X(R+.3),g.Y(i)); } c.stroke();
 c.restore(); arrow(g.X(-R-.5),g.Y(0),g.X(R+.6),g.Y(0),K.axis,3,16,a); arrow(g.X(0),g.Y(-R-.5),g.X(0),g.Y(R+.6),K.axis,3,16,a);
 if(labels){ c.save(); c.globalAlpha*=a; c.fillStyle=K.axis; c.font='italic 600 34px "STIX Two Text"'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('x',g.X(R+.45),g.Y(-.6)); c.fillText('y',g.X(.55),g.Y(R+.35)); c.fillText('O',g.X(-.45),g.Y(-.5));
  c.font='400 22px "STIX Two Text"'; c.fillStyle=K.muted; for(let i=-R+1;i<R;i++){ if(!i||i%2) continue; c.fillText(fm(i),g.X(i),g.Y(-.45)); c.fillText(fm(i),g.X(-.5),g.Y(i)); } c.restore(); } }
function clipLine(p,d,R){ let t0=-1e9,t1=1e9; for(let k=0;k<2;k++){ if(Math.abs(d[k])<1e-9){ if(p[k]<-R||p[k]>R) return null; } else { let a=(-R-p[k])/d[k], b=(R-p[k])/d[k]; if(a>b)[a,b]=[b,a]; t0=Math.max(t0,a); t1=Math.min(t1,b); } }
 let A=[p[0]+d[0]*t0,p[1]+d[1]*t0], B=[p[0]+d[0]*t1,p[1]+d[1]*t1]; if(A[0]>B[0]+1e-9||(Math.abs(A[0]-B[0])<1e-9&&A[1]<B[1]))[A,B]=[B,A]; return [A,B]; }
function lineThrough(g,p,d,R,col,prog=1,w=7,glow=true,a=1){ const s=clipLine(p,d,R); if(!s||a<=0) return null; const [A,B]=s; const ax=g.X(A[0]),ay=g.Y(A[1]),bx=g.X(B[0]),by=g.Y(B[1]);
 c.save(); c.globalAlpha*=a; c.strokeStyle=col; c.lineCap='round'; c.lineWidth=w; if(glow){ c.shadowColor=col; c.shadowBlur=16; }
 const px=ax+(bx-ax)*prog, py=ay+(by-ay)*prog; c.beginPath(); c.moveTo(ax,ay); c.lineTo(px,py); c.stroke();
 if(prog>0&&prog<1){ c.shadowBlur=30; c.fillStyle='#fff'; c.beginPath(); c.arc(px,py,12,0,7); c.fill(); c.fillStyle=col; c.beginPath(); c.arc(px,py,6,0,7); c.fill(); }
 c.restore(); return s; }
function tag(txt,x,y,col,size=30,a=1,math=true){ if(a<=0) return; c.save(); c.globalAlpha*=a; c.font=math?`600 ${size}px "STIX Two Text"`:`700 ${size}px Cairo`; c.direction=math?'ltr':'rtl'; const w=c.measureText(txt).width;
 c.fillStyle='rgba(251,245,230,.92)'; c.beginPath(); c.roundRect(x-w/2-10,y-size*0.7,w+20,size*1.4,10); c.fill(); c.fillStyle=col; c.textAlign='center'; c.textBaseline='middle'; c.fillText(txt,x,y+1); c.restore(); }
function truck(x,y,ang,s,a=1){ if(a<=0) return; c.save(); c.globalAlpha*=a; c.translate(x,y); c.rotate(ang); c.scale(s,s); c.fillStyle='#2d2d2d'; c.beginPath(); c.roundRect(-34,-30,46,26,3); c.fill(); c.beginPath(); c.roundRect(14,-22,20,18,4); c.fill();
 c.fillStyle='#ffd84a'; c.fillRect(18,-19,10,8); for(const wx of [-22,22]){ c.fillStyle='#2d2d2d'; c.beginPath(); c.arc(wx,-3,8,0,7); c.fill(); c.fillStyle='#ffd84a'; c.beginPath(); c.arc(wx,-3,3,0,7); c.fill(); } c.restore(); }
function check(x,y,s,col,a=1){ if(a<=0) return; c.save(); c.globalAlpha*=a; c.strokeStyle=col; c.lineWidth=9*s; c.lineCap='round'; c.lineJoin='round'; c.beginPath(); c.moveTo(x-22*s,y); c.lineTo(x-6*s,y+16*s); c.lineTo(x+24*s,y-18*s); c.stroke(); c.restore(); }
function cross(x,y,s,col,a=1){ if(a<=0) return; c.save(); c.globalAlpha*=a; c.strokeStyle=col; c.lineWidth=9*s; c.lineCap='round'; c.beginPath(); c.moveTo(x-18*s,y-18*s); c.lineTo(x+18*s,y+18*s); c.moveTo(x+18*s,y-18*s); c.lineTo(x-18*s,y+18*s); c.stroke(); c.restore(); }
function title(txt,lt,col=K.ink){ ar(txt,1820,118,62,col,{w:800,a:P(lt,0.15,0.7)}); c.save(); c.globalAlpha=P(lt,0.3,0.9); c.fillStyle=K.slope; const w=arW(txt,62,800)*P(lt,0.3,1); c.fillRect(1820-w,160,w,6); c.restore(); }
function cap(txt,x,y,size,col,a,w=700){ ar(txt,x,y,size,col,{w,a}); }

/* ================= scenes: equation of a line ================= */
const LM=1.5, LB=0.5, Lf=x=>LM*x+LB;          // y = 3/2 x + 1/2 through A(1,2)
const GA=G(600,575,52);
function keyInterp(keys,lt){ // keys: [t, ...vals]
 if(lt<=keys[0][0]) return keys[0].slice(1); for(let i=0;i<keys.length-1;i++){ const a=keys[i],b=keys[i+1]; if(lt>=a[0]&&lt<=b[0]){ const e=ease(cl((lt-a[0])/(b[0]-a[0]))); return a.slice(1).map((v,k)=>v+(b[k+1]-v)*e); } } return keys[keys.length-1].slice(1); }
function plane(x,y,s=1,a=1){ if(a<=0) return; c.save(); c.globalAlpha*=a; c.translate(x,y); c.scale(-s,s); c.fillStyle='#4c7bd8'; c.strokeStyle='#1d2f55'; c.lineWidth=2;
 c.beginPath(); c.moveTo(28,0); c.lineTo(-24,-6); c.lineTo(-32,-24); c.lineTo(-40,-24); c.lineTo(-36,-4); c.lineTo(-52,-2); c.lineTo(-52,2); c.lineTo(-36,4); c.lineTo(-40,24); c.lineTo(-32,24); c.lineTo(-24,6); c.closePath(); c.fill(); c.stroke(); c.restore(); }
const L2=s=>s; // placeholder

// ---- 1. question ----
const PTS=[[-3,-4,1],[-1,-1,1],[1,2,1],[3,5,1],[-4,3,0],[2,-3,0],[4,1,0],[-2,5,0],[0,-5,0],[5,-1,0],[-5,0,0],[2,6,0],[-1,3,0],[5,4,0]];
function q1(lt){
 title('متى تكون النقطة على المستقيم؟',lt); const g=GA; grid(g,7,P(lt,0.1,0.8));
 lineThrough(g,[1,2],[2,3],7.3,K.slope,P(lt,0.6,1.8));
 const sel=P(lt,4.6,5.4);
 PTS.forEach(([x,y,on],i)=>{ const s=backE(lin(lt,2+i*0.12,2.5+i*0.12)); const col= on? K.slope : K.undef; dotP(g.X(x),g.Y(y),on?col:(sel>0?'#b9b2a5':K.ink),on?13:11,s*(on?1+0.25*sel:1),on?1:1-0.55*sel); });
 cap('بعض النقاط تقع عليه وبعضها لا…',1820,420,50,K.ink,P(lt,3.2,3.8),800);
 cap('ما الشرط الذي يفرز النقاط؟',1820,520,50,K.slope,P(lt,5.4,6),800);
 cap('الجواب مخبّأ في درس الميل',1820,640,40,K.muted,P(lt,6.4,7),600);
}
// ---- 2. defining condition ----
function q2(lt){
 title('الشرط: الميل من نقطة ثابتة لا يتغيّر',lt); const g=GA; grid(g,7,1); lineThrough(g,[1,2],[2,3],7.3,K.slope,1,6,false);
 const [px,off]=keyInterp([[0.6,3,0],[2.8,5,0],[5,-3,0],[7,-1,0],[8.4,3,0],[10.2,3,2.3],[13.4,3,2.3],[15,3,0],[18,3,0]],lt);
 const py=Lf(px)+off, rise=py-2, run=px-1, onL=Math.abs(off)<0.02, ap=P(lt,0.3,0.9);
 const col=onL?K.slope:K.run;
 if(Math.abs(run)>0.05){ c.save(); c.globalAlpha=0.12*ap; c.fillStyle=col; c.beginPath(); c.moveTo(g.X(1),g.Y(2)); c.lineTo(g.X(px),g.Y(2)); c.lineTo(g.X(px),g.Y(py)); c.closePath(); c.fill(); c.restore();
  arrow(g.X(1),g.Y(2),g.X(px),g.Y(2),K.run,6,18,ap); arrow(g.X(px),g.Y(2),g.X(px),g.Y(py),K.rise,6,18,ap);
  tag(fm(run),g.X((1+px)/2),g.Y(2)+(rise>=0?32:-32),K.run,32,ap); tag(fm(rise),g.X(px)+(run>0?46:-46),g.Y((2+py)/2),K.rise,32,ap); }
 c.save(); c.setLineDash([8,8]); c.globalAlpha=0.6*ap; c.strokeStyle=col; c.lineWidth=3; c.beginPath(); c.moveTo(g.X(1),g.Y(2)); c.lineTo(g.X(px),g.Y(py)); c.stroke(); c.restore();
 dotP(g.X(1),g.Y(2),K.ink,13,ap); tag('A(1, 2)',g.X(1)-80,g.Y(2)+6,K.ink,30,ap);
 dotP(g.X(px),g.Y(py),col,14,ap); tag('P(x, y)',g.X(px)+(px>0?-90:90),g.Y(py)-40,col,30,ap);
 // readout
 const fx=1430, ra=P(lt,0.8,1.4);
 row([F([v('y',K.rise),n(' − 2',K.rise)],[v('x',K.run),n(' − 1',K.run)])],fx-250,330,62,{a:ra});
 row([n('= '),F([n(fm(rise),K.rise)],[n(fm(run),K.run)]),n(' = '),n(Math.abs(run)>0.05?fm(rise/run):'—',col,1)],fx+90,330,62,{a:ra});
 const okA=onL?1:0; check(1060,330,1.3,K.slope,ra*okA); cross(1060,330,1.2,K.run,ra*(1-okA));
 ar(onL?'النسبة ثابتة دائماً = '+ISO('1.5'):'تغيّرت النسبة ← P ليست على المستقيم',1820,520,40,col,{a:ra,w:800});
 const ca=P(lt,15.2,15.9); if(ca>0){ pill(1000,700,840,190,'rgba(20,144,90,.10)',ca,K.slope);
  ar('P على المستقيم إذا وفقط إذا',1800,750,36,K.ink,{a:ca,w:700});
  row([F([v('y'),n(' − 2')],[v('x'),n(' − 1')]),n(' = '),F([n('3')],[n('2')])],1420,830,54,{a:ca}); }
}
// ---- 3. derivation ----
function q3(lt){
 title('من الشرط إلى المعادلة',lt);
 const a1=P(lt,0.4,1); row([F([v('y',K.rise),n(' − 2',K.rise)],[v('x',K.run),n(' − 1',K.run)]),n(' = '),F([n('3')],[n('2')],K.slope)],960,300,74,{a:a1});
 const m1=P(lt,2.2,2.8); ar('اضرب الطرفين في '+ISO('(x − 1)'),1700,420,38,K.muted,{a:m1*(1-P(lt,5.6,6)),w:700});
 const a2=P(lt,3,3.6); row([v('y',K.rise),n(' − 2',K.rise),n(' = '),F([n('3')],[n('2')],K.slope),n(' ('),v('x',K.run),n(' − 1',K.run),n(')')],960,500,74,{a:a2});
 const a3=P(lt,6.2,6.9); if(a3>0){ pill(560,620,800,150,'rgba(20,144,90,.10)',a3,K.slope);
  row([v('y',K.rise),n(' − ',K.rise),v('y',K.rise),sb('1',K.rise),n(' = '),v('m',K.slope),n(' ('),v('x',K.run),n(' − ',K.run),v('x',K.run),sb('1',K.run),n(')')],960,695,80,{a:a3});
  ar('صيغة النقطة والميل',960,820,40,K.slope,{a:P(lt,7,7.5),w:800,align:'center'}); }
 cap('ليست قانوناً جديداً: إنها تعريف الميل نفسه، بنقطة متحركة '+ISO('(x, y)'),1820,920,38,K.ink,P(lt,9.2,9.9),700);
 // side hint tags
 const t1=P(lt,6.9,7.6); tag('(x₁, y₁) = (1, 2)',380,690,K.ink,30,t1,true); tag('m = 3/2',1560,690,K.slope,30,t1,true);
}
// ---- 4. slope-intercept ----
function q4(lt){
 title('صيغة الميل والمقطع',lt); const g=GA; grid(g,7,1);
 const [mm,bb]=keyInterp([[0,1.5,0.5],[8,1.5,0.5],[9.2,1.5,3],[10.2,1.5,3],[11.2,1.5,-2],[12.2,1.5,-2],[12.9,1.5,0.5],[13.6,3,0.5],[14.4,3,0.5],[15.1,-1,0.5],[15.8,-1,0.5],[16.4,0,0.5],[17,0,0.5],[17.6,1.5,0.5]],lt);
