<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ميل المستقيم — كتاب حي</title>
<style>
:root{
  --paper:#fbf5e6;--paper2:#fffaf0;--ink:#2b2925;--muted:#6f675a;--rule:rgba(120,95,60,.13);
  --grid:#e2d7c1;--axis:#5d5447;
  --rise:#1f6fd1;--run:#d6453d;--slope:#14905a;
  --pos:#0f9d8a;--neg:#c2408a;--zero:#b08a12;--undef:#6b6b78;
  --A:#e0861a;--B:#7b4fd1;--par:#e0861a;--perp:#14905a;
  --note:#ffe98a;--noteInk:#4a3f12;--card:#fffdf6;--cardline:rgba(0,0,0,.14);
  --barbg:rgba(252,247,236,.86);--barInk:#3a332a;--btn:#fff9ec;--btnLine:#d9c9a8;
  --barH:66px;
}
body.dark{
  --paper:#2a2621;--paper2:#2f2b25;--ink:#ece5d7;--muted:#aea38f;--rule:rgba(255,240,210,.07);
  --grid:#433d34;--axis:#bdb29e;
  --rise:#5ea6ff;--run:#ff7d70;--slope:#3fd08c;
  --pos:#35d2bd;--neg:#f07ab9;--zero:#e3c24d;--undef:#a9a9b8;
  --A:#ffae4d;--B:#ae8cff;--par:#ffae4d;--perp:#3fd08c;
  --note:#d9c45c;--noteInk:#2d2608;--card:#36312a;--cardline:rgba(255,255,255,.14);
  --barbg:rgba(40,35,29,.88);--barInk:#efe6d4;--btn:#38322a;--btnLine:#5b5143;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Noto Kufi Arabic","Noto Sans Arabic","Geeza Pro","Segoe UI","Tahoma",system-ui,sans-serif;color:var(--ink);background:#dcc196;-webkit-tap-highlight-color:transparent}
html[lang=en] .hook{font-style:italic}
html[lang=en] body{font-family:"Segoe UI","Inter","Helvetica Neue",system-ui,sans-serif}
/* ---------- desk ---------- */
.desk{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.desk .night{display:none}
body.dark .desk .day{display:none} body.dark .desk .night{display:inline}
.deskfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(120% 90% at 12% 0%,rgba(255,250,235,.42),rgba(255,250,235,0) 55%),
   radial-gradient(140% 120% at 50% 45%,rgba(0,0,0,0) 55%,rgba(40,20,5,.28) 100%),
   repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 196px,rgba(95,62,28,.16) 196px 198px,rgba(255,240,210,.12) 198px 199px)}
body.dark .deskfx{background:
   radial-gradient(120% 90% at 12% 0%,rgba(255,230,180,.10),rgba(0,0,0,0) 55%),
   radial-gradient(140% 120% at 50% 45%,rgba(0,0,0,0) 50%,rgba(0,0,0,.45) 100%),
   repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 196px,rgba(0,0,0,.25) 196px 198px)}
/* ---------- stage & book ---------- */
#viewport{position:fixed;left:0;right:0;top:0;bottom:var(--barH);z-index:1;touch-action:pan-y}
#stage{position:absolute;left:50%;top:50%;perspective:2600px;perspective-origin:50% 30%}
#book{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(9deg)}
.bshadow{position:absolute;left:-10px;right:-10px;top:30px;bottom:-40px;transform:translateZ(-22px);border-radius:30px;box-shadow:0 50px 80px -10px rgba(50,25,5,.55),0 18px 30px rgba(50,25,5,.25)}
.cover{position:absolute;left:-20px;right:-20px;top:-17px;bottom:-19px;border-radius:12px;transform:translateZ(-14px);
  background:radial-gradient(120% 80% at 30% 10%,rgba(255,255,255,.12),rgba(0,0,0,0) 60%),linear-gradient(160deg,#8a4426,#5c2814 70%,#4a1f0f)}
.cover::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,215,170,.32);border-radius:8px}
.stack{position:absolute;left:-8px;right:-8px;top:-5px;bottom:-11px;transform:translateZ(-7px);border-radius:4px;
  background:repeating-linear-gradient(90deg,#efe5cf 0 2px,#d9cbb0 2px 3px);box-shadow:inset 0 -3px 4px rgba(0,0,0,.12)}
.stack::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.25),rgba(0,0,0,0))}
body.mobile .stack::after{display:none}
.slot{position:absolute;top:0;width:480px;height:860px;transform-style:preserve-3d}
#slotL{left:0} #slotR{left:480px}
body.mobile #slotR{display:none}
.flipshade{position:absolute;inset:0;pointer-events:none;opacity:0;transform:translateZ(1px);background:linear-gradient(90deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.28) 50%,rgba(0,0,0,0) 70%)}
/* ---------- page ---------- */
.page{position:absolute;left:0;top:0;width:480px;height:860px;transform-style:preserve-3d;color:var(--ink);display:none;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 31px,var(--rule) 31px 32px)}
.page.on{display:block}
/* spine shading: text page spine at inline-end, lab page at inline-start */
[dir=rtl] .page.text{box-shadow:inset 34px 0 34px -26px rgba(60,40,15,.32)}
[dir=rtl] .page.lab{box-shadow:inset -34px 0 34px -26px rgba(60,40,15,.32)}
[dir=ltr] .page.text{box-shadow:inset -34px 0 34px -26px rgba(60,40,15,.32)}
[dir=ltr] .page.lab{box-shadow:inset 34px 0 34px -26px rgba(60,40,15,.32)}
.pin{position:absolute;inset:0;padding:30px 34px 34px}
.kick{font-size:12.5px;color:var(--muted);letter-spacing:.2px;display:flex;justify-content:space-between}
.hook{font-size:16px;color:var(--muted);margin:10px 0 4px;line-height:1.6}
h2{font-size:27px;margin:2px 0 8px;line-height:1.3}
.pin p{font-size:15.5px;line-height:1.75;margin:0 0 8px}
.pgno{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.m{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif;font-size:1.06em;white-space:nowrap;unicode-bidi:isolate}
.m i{font-style:italic}
.m sub{font-size:.68em;vertical-align:-.25em;line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .14em;line-height:1.15}
.fr>.fn{border-bottom:1.6px solid currentColor;padding:0 .22em .06em}
.fr>.fd{padding:.06em .22em 0}
.c-rise{color:var(--rise)} .c-run{color:var(--run)} .c-slope{color:var(--slope);font-weight:700}
.c-pos{color:var(--pos)} .c-neg{color:var(--neg)} .c-zero{color:var(--zero)} .c-undef{color:var(--undef)}
.c-A{color:var(--A)} .c-B{color:var(--B)} .c-par{color:var(--par)} .c-perp{color:var(--perp)}
.src{color:var(--muted);font-size:.86em;white-space:nowrap}
.lawrow{display:flex;gap:12px;align-items:stretch;margin:6px 0 10px}
.law{flex:1;min-width:0;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--paper2);font-size:19px;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:center;line-height:1.5}
.law .lbl{font-size:12px;color:var(--muted)}
.sticky{width:138px;flex:none;background:var(--note);color:var(--noteInk);font-size:13px;line-height:1.55;padding:16px 11px 10px;transform:rotate(2.4deg);box-shadow:0 6px 10px -4px rgba(0,0,0,.28);position:relative;border-radius:2px 2px 14px 2px}
[dir=ltr] .sticky{transform:rotate(-2.4deg)}
.sticky::before{content:"";position:absolute;top:-9px;left:50%;width:56px;height:18px;margin-left:-28px;background:rgba(255,255,255,.55);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.box{border:1.5px dashed var(--btnLine);border-radius:12px;padding:9px 12px;margin:0 0 10px;background:rgba(255,255,255,.18)}
body.dark .box{background:rgba(255,255,255,.03)}
.btitle{font-weight:800;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.box p{font-size:14.5px!important;margin:0 0 6px!important;line-height:1.65!important}
.reveal{position:relative;min-height:82px;perspective:420px;perspective-origin:50% 120%}
.ans{font-size:14px;line-height:1.65;padding:8px 10px;background:rgba(20,144,90,.08);border-radius:8px;min-height:82px}
.flap{position:absolute;inset:-2px;transform-origin:50% 0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.35,.5,1);cursor:pointer}
.flap>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px}
.flap .ff{background:linear-gradient(180deg,#f3e3bd,#ead6a6);border:1px solid #d3bb86;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:#5b4720;font-size:15px;box-shadow:0 3px 6px rgba(0,0,0,.15)}
body.dark .flap .ff{background:linear-gradient(180deg,#5a4c33,#4a3e29);border-color:#6b5a3a;color:#f3e4c2}
.flap .ff::after{content:"";position:absolute;bottom:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(0,0,0,.18)}
.flap .fb{transform:rotateX(180deg);background:#e6d3a6}
body.dark .flap .fb{background:#4a3e29}
.reveal.open .flap{transform:rotateX(118deg);pointer-events:none}
.reveal.open .ans{cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-width:62px;min-height:44px;padding:6px 14px;border-radius:12px;border:2px solid var(--btnLine);background:var(--btn);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:background .2s}
.opt:active{background:var(--grid)}
.opt.ok{background:rgba(20,144,90,.16);border-color:var(--slope)}
.opt.no{background:rgba(214,69,61,.10);border-color:rgba(214,69,61,.5)}
.fb{font-size:13.5px;line-height:1.6;margin-top:6px;min-height:1px}
.fb.ok{color:var(--slope)}
.numrow{display:flex;gap:8px;align-items:center}
.num{width:110px;height:44px;border-radius:10px;border:2px solid var(--btnLine);background:var(--paper2);color:var(--ink);font-size:18px;text-align:center;direction:ltr}
/* ---------- lab page ---------- */
.pop-area{position:absolute;left:30px;right:30px;top:20px;height:150px;transform-style:preserve-3d}
.popup{position:absolute;inset:0;transform-style:preserve-3d}
.panel{position:absolute;bottom:0;transform-origin:50% 100%;transform:rotateX(0deg);transition:transform .8s cubic-bezier(.28,1.55,.5,1);transform-style:preserve-3d}
.panel.card{background:var(--card);border:1px solid var(--cardline);border-radius:5px;background-image:linear-gradient(0deg,rgba(0,0,0,.04),rgba(0,0,0,0) 30%)}
.popup.up .panel{transform:rotateX(-56deg)}
.popup.up .panel.hi{transform:rotateX(-70deg)}
.pshadow{position:absolute;bottom:-20px;height:24px;background:radial-gradient(ellipse at 50% 0,rgba(40,25,5,.32),rgba(0,0,0,0) 70%);transform-origin:50% 0;transform:scaleY(.05);transition:transform .8s}
.popup.up .pshadow{transform:scaleY(1)}
.panel svg{display:block;width:100%;height:100%;overflow:visible}
.pencil{filter:url(#pencil)}
.plabel{position:absolute;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}
.labbox{position:absolute;left:24px;right:24px;top:182px;transform:translateZ(1px)}
.labhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:6px}
.tag{background:var(--ink);color:var(--paper);font-size:11px;border-radius:20px;padding:2px 9px;font-weight:700}
.hint{font-size:12px;color:var(--muted);font-weight:500}
.cv-wrap{position:relative;direction:ltr;margin:0 auto;border-radius:8px;background:var(--paper2);box-shadow:0 0 0 1px var(--cardline)}
.cv-wrap canvas{display:block;touch-action:none;cursor:grab;border-radius:8px}
.mk{position:absolute;width:2px;height:2px;pointer-events:none}
.mk.tl{left:-1px;top:-1px}.mk.tr{right:-1px;top:-1px}.mk.br{right:-1px;bottom:-1px}.mk.bl{left:-1px;bottom:-1px}
.readout{margin:8px 0 6px;min-height:66px;font-size:15.5px;text-align:center;line-height:1.7;border-radius:10px;padding:6px 8px;background:rgba(20,144,90,.06)}
.readout>div{direction:ltr;unicode-bidi:isolate}
.readout .row2{font-size:13px;color:var(--muted)}
.ctrls{display:flex;flex-direction:column;gap:7px}
.ctrls .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.b{min-height:40px;padding:5px 12px;border-radius:11px;border:2px solid var(--btnLine);background:var(--btn);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.b.sm{min-width:44px;padding:5px 8px}
.b.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.b:active{background:var(--grid)}
.lbl{font-size:12.5px;color:var(--muted)}
.slider{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;direction:ltr}
.slider input{flex:1;max-width:260px;height:34px;accent-color:var(--slope)}
.chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:3px}
.chip{font-size:12.5px;padding:2px 10px;border-radius:20px;border:1.5px solid var(--cardline);opacity:.55}
.chip.on{opacity:1;font-weight:800;border-color:currentColor;box-shadow:0 0 0 2px currentColor inset}
.verdict{display:inline-block;padding:1px 12px;border-radius:20px;font-weight:800;border:2px solid currentColor}
/* challenge */
.pips{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.pip{width:30px;height:8px;border-radius:5px;background:var(--grid)}
.pip.cur{background:var(--ink)} .pip.ok{background:var(--slope)} .pip.no{background:var(--zero)}
.q{font-size:15.5px;line-height:1.85;margin:0 0 10px}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optgrid .opt{width:100%;min-height:50px}
.graphs{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}
.gcell{border:2px solid var(--btnLine);border-radius:12px;background:var(--paper2);padding:4px;cursor:pointer}
.gcell.ok{border-color:var(--slope);background:rgba(20,144,90,.12)} .gcell.no{border-color:rgba(214,69,61,.5)}
.gcell svg{display:block;width:100%;height:auto}
.explain{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(20,144,90,.08);font-size:14px;line-height:1.75;display:none}
.explain.show{display:block}
.next{margin-top:10px;display:none}
.next.show{display:inline-block}
.result{text-align:center;padding-top:10px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:14px 0}
.bigstars svg{width:66px;height:66px}
/* bursts */
.burst{position:fixed;pointer-events:none;z-index:50;font-size:22px;color:#f1b51c;text-shadow:0 1px 2px rgba(0,0,0,.25);animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg);opacity:0}}
/* leaf */
.leaf{position:absolute;top:0;width:480px;height:860px;transform-style:preserve-3d;transform:translateZ(3px);pointer-events:none}
.strip{position:absolute;top:0;height:860px;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:var(--paper);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 31px,var(--rule) 31px 32px)}
.face.back{transform:rotateY(180deg)}
.face .page{display:block!important;box-shadow:none!important}
.face .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
/* ---------- nav bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--barH);z-index:20;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px env(safe-area-inset-bottom);background:var(--barbg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(0,0,0,.08);color:var(--barInk)}
#bar .grp{display:flex;align-items:center;gap:6px}
.nb{min-width:44px;height:42px;border-radius:12px;border:1.5px solid var(--btnLine);background:var(--btn);color:var(--barInk);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.nb:disabled{opacity:.35}
.nb.on{background:var(--barInk);color:var(--btn)}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--btnLine);background:var(--btn);color:var(--barInk);font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.dot.cur{border-color:var(--barInk);box-shadow:0 0 0 2px var(--barInk) inset}
.dot.done{background:var(--slope);border-color:var(--slope);color:#fff}
.arw{display:inline-block}
[dir=rtl] .arw{transform:scaleX(-1)}
.sep{width:1px;height:28px;background:var(--btnLine)}
body.mobile{--barH:104px}
body.mobile #bar{flex-direction:column;gap:6px;padding-top:6px}
body.mobile .tx{display:none}
/* teacher */
#teacher{position:fixed;inset:0;z-index:30;display:none;background:var(--paper)}
#teacher.on{display:block}
#teacher .tin{position:absolute;left:50%;top:50%;width:432px;transform-origin:50% 50%}
#teacher .tclose{position:absolute;top:12px;inset-inline-end:14px;z-index:2}
#teacher .labbox{position:static}
/* motion off */
body.nomotion .panel,body.nomotion .pshadow,body.nomotion .flap{transition:none!important}
</style>
</head>
<body>
<svg class="desk" aria-hidden="true">
  <defs>
    <filter id="grainDay" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.085" numOctaves="4" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.34  0 0 0 0 0.16  1.35 0 0 0 -0.52"/>
    </filter>
    <filter id="grainNight" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.085" numOctaves="4" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.06  0 0 0 0 0.03  1.4 0 0 0 -0.45"/>
    </filter>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g class="day"><rect width="100%" height="100%" fill="#e6cda0"/><rect width="100%" height="100%" filter="url(#grainDay)"/></g>
  <g class="night"><rect width="100%" height="100%" fill="#5b4430"/><rect width="100%" height="100%" filter="url(#grainNight)"/></g>
</svg>
<div class="deskfx"></div>

<div id="viewport">
  <div id="stage">
    <div id="book">
      <div class="bshadow"></div>
      <div class="cover"></div>
      <div class="stack"></div>
      <div class="slot" id="slotL"></div>
      <div class="slot" id="slotR"></div>
      <div class="flipshade" id="flipshade"></div>
    </div>
  </div>
</div>
<div id="holder" style="display:none"></div>

<nav id="bar">
  <div class="grp">
    <button class="nb" id="prev"><span class="arw">◀</span><span class="tx" data-i18n="prev"></span></button>
    <div class="dots" id="dots"></div>
    <button class="nb" id="next"><span class="tx" data-i18n="next"></span><span class="arw">▶</span></button>
  </div>
  <div class="grp">
    <span class="sep"></span>
    <button class="nb" id="bLang"></button>
    <button class="nb" id="bTheme" title="Dark / Light">☾</button>
    <button class="nb" id="bMute" title="Mute">🔊</button>
    <button class="nb" id="bMotion"></button>
    <button class="nb" id="bTeach"></button>
  </div>
</nav>
<div id="teacher"><button class="nb tclose" id="tClose">✕ <span data-i18n="exitT"></span></button><div class="tin" id="tin"></div></div>

<script>
'use strict';
const W=480,H=860;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const S={lang:'ar',chap:0,side:0,dark:false,motion:true,muted:false,teacher:false,mobile:false,busy:false,
  done:[0,0,0,0,0],lastTouch:0,scale:1,tScale:1};
try{S.dark=matchMedia('(prefers-color-scheme: dark)').matches}catch(e){}

/* ================= math markup helpers ================= */
const M=s=>`<bdi dir="ltr" class="m">${s}</bdi>`;
const fr=(n,d)=>`<span class="fr"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
const iv=s=>`<i>${s}</i>`;
const sb=(v,k)=>`<i>${v}</i><sub>${k}</sub>`;
const cR=s=>`<span class="c-rise">${s}</span>`, cU=s=>`<span class="c-run">${s}</span>`, cM=s=>`<span class="c-slope">${s}</span>`;

function fmtN(n){ if(!isFinite(n)) return '∞'; const r=Math.round(n*100)/100; const s=(Object.is(r,-0)?0:r).toString(); return s.replace('-',MI); }

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function frac(n,d){ if(d===0) return null; if(d<0){n=-n;d=-d} const g=gcd(n,d); return [n/g,d/g]; }
function fracH(n,d){ const f=frac(n,d); if(!f) return fr(fmtN(n),'0'); const [a,b]=f; if(b===1) return fmtN(a); return (a<0?MI:'')+fr(Math.abs(a),b); }
function fracTxt(n,d){ const f=frac(n,d); if(!f) return '∄'; const [a,b]=f; return b===1?fmtN(a):(a<0?MI:'')+Math.abs(a)+'/'+b; }

function solve(A,b){ const n=b.length; for(let i=0;i<n;i++){ let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r; [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
  for(let r=i+1;r<n;r++){ const f=A[r][i]/A[i][i]; for(let c=i;c<n;c++) A[r][c]-=f*A[i][c]; b[r]-=f*b[i]; } }
 const x=new Array(n); for(let i=n-1;i>=0;i--){ let s=b[i]; for(let c=i+1;c<n;c++) s-=A[i][c]*x[c]; x[i]=s/A[i][i]; } return x; }

 if(r.type==='graph') body=`<div class="graphs">${GRAPH_ORDER.map((k,j)=>`<div class="gcell" data-j="${j}">${miniGraph(k)}</div>`).join('')}</div>`;
 else if(r.type==='mcq') body=`<div class="optgrid">${r.opts.map((o,j)=>`<button class="opt" data-j="${j}">${L(o[0],o[1])}</button>`).join('')}</div>`;
 else body=`<div class="numrow"><input class="num" type="text" inputmode="decimal"><span class="m">${r.unit||''}</span><button class="opt" id="numgo">${t('verify')}</button></div>`;
 box.innerHTML=`<div class="lbl">${t('round')} ${M((CH.i+1)+'')} ${t('of')} ${M('7')}</div><p class="q">${L(r.q[0],r.q[1])}</p>${body}<div class="explain" id="exp"></div><button class="b on next" id="nxt">${CH.i<6?t('nextR'):t('finish')}</button>`;
 const mark=(j,ok)=>{ const el=box.querySelector(`[data-j="${j}"]`); el&&el.classList.add(ok?'ok':'no'); };
 const answer=(j,e,val)=>{ if(CH.answered) return; const ok= r.type==='num'? Math.abs(val-r.ok)<1e-6 : j===r.ok;
  if(CH.first[CH.i]===undefined) CH.first[CH.i]=ok;
  if(r.type!=='num'){ mark(j,ok); if(!ok) mark(r.ok,true); }
  CH.answered=true; const ex=$('#exp'); ex.innerHTML=(ok?'<b class="c-slope">'+t('rightA')+'</b>':'<b>'+t('wrongA')+'</b>'+(r.type==='num'?M(fmtN(r.ok)+' '+(r.unit||''))+'. ':''))+L(r.ex[0],r.ex[1]); ex.classList.add('show'); $('#nxt').classList.add('show');
  if(ok){ burst(e,12); blip([660,880,1047],0.25); } else blip([300],0.12,'sine',0.05);
  CH.lastHTML=box.innerHTML; renderPips(); };
 $$('[data-j]',box).forEach(el=>el.addEventListener('click',e=>answer(+el.dataset.j,e)));
 if(r.type==='num'){ const inp=$('.num',box); const go=e=>answer(-1,e,parseFloat(inp.value.replace('−','-').replace(',','.'))); $('#numgo').addEventListener('click',go); inp.addEventListener('keydown',e=>{if(e.key==='Enter')go(e);}); }
 $('#nxt').addEventListener('click',()=>{ CH.answered=false; if(CH.i<6) CH.i++; else { CH.done=true; S.done[4]=1; updateNav(); burst(null,24); blip([523,659,784,1047],0.4); } renderChal(); });
}
function renderPips(){ $('#pips').innerHTML=ROUNDS.map((_,i)=>`<span class="pip ${CH.first[i]===true?'ok':CH.first[i]===false?'no':''} ${i===CH.i&&!CH.done?'cur':''}"></span>`).join(''); }
function popStars(st){ [0,1,2].forEach(k=>{ const g=$('#pp5s'+k); g&&g.setAttribute('fill',k<st?'#f2c94c':'none'); }); }

/* ================= predict flaps ================= */
document.addEventListener('click',e=>{ const f=e.target.closest('.flap')||(e.target.closest('.reveal.open .ans')); if(f){ const r=f.closest('.reveal'); r.classList.toggle('open'); blip([520],0.1,'triangle',0.05); } });

/* ================= layout & paging ================= */
const stage=$('#stage'), book=$('#book'), slotL=$('#slotL'), slotR=$('#slotR');
const textSide=()=>S.lang==='ar'?'R':'L';
const labSide=()=>textSide()==='R'?'L':'R';
const slotOf=s=>s==='L'?slotL:slotR;
function pageAt(c,side){ return side===textSide()?PAGES[c].text:PAGES[c].lab; }
function seqPage(q){ const c=q>>1; return q%2?PAGES[c].lab:PAGES[c].text; }
function show(slot,page){ $$('.page',slot).forEach(p=>{ if(p!==page){ p.classList.remove('on'); holder.appendChild(p);} }); if(page){ slot.appendChild(page); page.classList.add('on'); } }
function placePages(){ PAGES.forEach(p=>{ p.text.classList.remove('on'); p.lab.classList.remove('on'); });
 if(S.mobile){ show(slotR,null); show(slotL,seqPage(S.chap*2+S.side)); }
 else { show(slotOf(textSide()),PAGES[S.chap].text); show(slotOf(labSide()),PAGES[S.chap].lab); } }
function fit(){
 const wasMobile=S.mobile; S.mobile=innerWidth<600 && innerHeight>innerWidth; document.body.classList.toggle('mobile',S.mobile);
 const barH=S.mobile?104:66; const bw=S.mobile?W:2*W;
 const padX=S.mobile?40:110, padY=S.mobile?70:110;
 S.scale=Math.min(innerWidth/(bw+padX),(innerHeight-barH)/(H+padY));
 stage.style.width=bw+'px'; stage.style.height=H+'px';
 stage.style.transform=`translate(-50%,-50%) scale(${S.scale})`; stage.style.top=((innerHeight-barH)/2+ (S.mobile?6:4)*S.scale)+'px';
 if(wasMobile!==S.mobile) placePages();
 if(S.teacher) fitTeacher(); labs.forEach(l=>l&&(l.res=0));
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function popsUp(on){ $$('.popup').forEach(p=>p.classList.toggle('up',on)); }

function cloneFor(page,offset){ const cl=page.cloneNode(true); cl.removeAttribute('id'); $$('[id]',cl).forEach(e=>e.removeAttribute('id')); $$('.popup',cl).forEach(p=>p.classList.remove('up'));
 const src=$$('canvas',page), dst=$$('canvas',cl); src.forEach((c,i)=>{ try{ dst[i].width=c.width; dst[i].height=c.height; dst[i].getContext('2d').drawImage(c,0,0);}catch(e){} });
 cl.style.left=offset+'px'; cl.classList.add('on'); return cl; }
function buildLeaf(type,front,back){
 const leaf=document.createElement('div'); leaf.className='leaf'; const N=8,w=W/N; let parent=leaf; const strips=[], shades=[];
 for(let i=0;i<N;i++){ const s=document.createElement('div'); s.className='strip'; s.style.width=w+'px';
  if(type==='L'){ s.style.left=(i===0?W-w:-w)+'px'; s.style.transformOrigin='100% 50%'; } else { s.style.left=(i===0?0:w)+'px'; s.style.transformOrigin='0% 50%'; }
  const ff=document.createElement('div'); ff.className='face front'; const bb=document.createElement('div'); bb.className='face back';
  const fo=type==='L'?-(W-w*(i+1)):-w*i, bo=type==='L'?-w*i:-(W-w*(i+1));
  if(front) ff.appendChild(cloneFor(front,fo)); if(back) bb.appendChild(cloneFor(back,bo));
  const sf=document.createElement('div'); sf.className='shade'; ff.appendChild(sf); const sbk=document.createElement('div'); sbk.className='shade'; bb.appendChild(sbk);
  s.appendChild(ff); s.appendChild(bb); parent.appendChild(s); parent=s; strips.push(s); shades.push(sf,sbk); }
 return {leaf,strips,shades}; }
function animLeaf(L,from,to,sgn,mid,dur){ return new Promise(res=>{ const t0=performance.now(); const fs=$('#flipshade'); let crossed=false;
 const step=now=>{ let p=Math.min(1,(now-t0)/dur); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; const th=from+(to-from)*e;
  L.strips[0].style.transform=`rotateY(${th}deg)`; const bend=Math.sin(Math.PI*e)*5.5*sgn;
  for(let i=1;i<L.strips.length;i++) L.strips[i].style.transform=`rotateY(${bend}deg)`;
  const lit=Math.abs(Math.sin(th*Math.PI/180)); L.shades.forEach((s,i)=>{ s.style.opacity=(i%2?0.22:0.3)*lit; }); fs.style.opacity=0.8*lit;
  if(!crossed && Math.abs(th)>=90 !== Math.abs(from)>=90){ crossed=true; mid&&mid(); }
  if(p<1) requestAnimationFrame(step); else { fs.style.opacity=0; res(); } };
 requestAnimationFrame(step); }); }
async function go(to){
 const maxQ=9; if(S.busy) return;
 if(S.mobile){ const q=S.chap*2+S.side; if(to<0||to>maxQ||to===q) return; S.busy=true; voice(null);
  popsUp(false); if(S.motion) await wait(260); flipSound();
  const fwd=to>q, type=S.lang==='ar'?'L':'R', sgn=type==='L'?1:-1;
  if(S.motion){ if(fwd){ const Lf=buildLeaf(type,seqPage(q),null); Lf.leaf.style.left='0px'; book.appendChild(Lf.leaf); show(slotL,seqPage(to)); await animLeaf(Lf,0,180*sgn,sgn,null,850); Lf.leaf.remove(); }
   else { const Lf=buildLeaf(type,seqPage(to),null); Lf.leaf.style.left='0px'; book.appendChild(Lf.leaf); await animLeaf(Lf,180*sgn,0,sgn,null,850); show(slotL,seqPage(to)); Lf.leaf.remove(); } }
  else show(slotL,seqPage(to));
  S.chap=to>>1; S.side=to%2;
 } else { const from=S.chap; if(to<0||to>4||to===from) return; S.busy=true; voice(null);
  popsUp(false); if(S.motion) await wait(280); flipSound();
  const fwd=to>from, fside=fwd?labSide():textSide(), oside=fside==='L'?'R':'L', sgn=fside==='L'?1:-1;
  if(S.motion){ const Lf=buildLeaf(fside,pageAt(from,fside),pageAt(to,oside)); Lf.leaf.style.left=(fside==='L'?0:W)+'px'; book.appendChild(Lf.leaf);
   show(slotOf(fside),pageAt(to,fside)); await animLeaf(Lf,0,180*sgn,sgn,()=>show(slotOf(oside),pageAt(to,oside)),1000); Lf.leaf.remove(); }
  placeAfter(to); S.chap=to; }
 S.chap=Math.max(0,Math.min(4,S.chap)); placePages(); labs.forEach(l=>{ if(l){ l.listen=false; l.stopCmp&&l.stopCmp(); l.stopFly&&l.stopFly(); l.stopG&&l.stopG(); } }); $$('[data-act="listen"]').forEach(b=>b.classList.remove('on')); S.lastTouch=0;
 updateNav(); await wait(60); popsUp(true); S.busy=false; const lab=labs[S.chap]; lab&&lab.restartPen(); }
function placeAfter(to){ S.chap=to; }
function step(d){ if(S.mobile) go(S.chap*2+S.side+d); else go(S.chap+d); }
function updateNav(){
 const q=S.chap*2+S.side; $('#prev').disabled=S.mobile?q===0:S.chap===0; $('#next').disabled=S.mobile?q===9:S.chap===4;
 $('#dots').innerHTML=[0,1,2,3,4].map(i=>`<button class="dot ${i===S.chap?'cur':''} ${S.done[i]?'done':''}" data-c="${i}" aria-label="${i+1}">${S.done[i]?'✓':(i===4?'★':i+1)}</button>`).join('');
 $$('#dots .dot').forEach(b=>b.addEventListener('click',()=>{ const c=+b.dataset.c; go(S.mobile?c*2:c); }));
}

/* ================= teacher mode ================= */
let tHome=null;
function fitTeacher(){ const tin=$('#tin'); const box=tin.firstElementChild; if(!box) return; const h=box.offsetHeight||700; S.tScale=Math.min((innerWidth*0.94)/432,(innerHeight-70)/h);
 tin.style.transform=`translate(-50%,-50%) scale(${S.tScale})`; tin.style.top=(innerHeight/2+18)+'px'; }
function teacher(on){ if(on===S.teacher) return; const lab=labs[S.chap]; if(!lab) return;
 if(on){ tHome={parent:lab.box.parentElement,next:lab.box.nextSibling,lab}; $('#tin').appendChild(lab.box); $('#teacher').classList.add('on'); S.teacher=true; fitTeacher(); lab.res=0; }
 else { tHome.parent.insertBefore(tHome.lab.box,tHome.next); $('#teacher').classList.remove('on'); S.teacher=false; tHome.lab.res=0; tHome=null; }
 $('#bTeach').classList.toggle('on',S.teacher); }

/* ================= main loop ================= */
let labs=[];
function loop(now){ try{ const lab=labs[S.chap]; if(lab && !S.busy){ const vis=S.teacher||lab.box.closest('.page.on'); if(vis) lab.frame(now); else voice(null); } else voice(null); }catch(e){ console.error(e); }
 requestAnimationFrame(loop); }

/* ================= controls ================= */
$('#prev').addEventListener('click',()=>step(-1)); $('#next').addEventListener('click',()=>step(1));
$('#bLang').addEventListener('click',()=>{ S.lang=S.lang==='ar'?'en':'ar'; applyI18n(); placePages(); updateNav(); });
$('#bTheme').addEventListener('click',()=>{ S.dark=!S.dark; document.body.classList.toggle('dark',S.dark); $('#bTheme').textContent=S.dark?'☀':'☾'; readTheme(); });
$('#bMute').addEventListener('click',()=>{ S.muted=!S.muted; $('#bMute').textContent=S.muted?'🔇':'🔊'; $('#bMute').classList.toggle('on',S.muted); if(S.muted) voice(null); });
function setMotionBtn(){ $('#bMotion').innerHTML=(S.motion?'⏸':'▶')+'<span class="tx">'+t('motionOn')+'</span>'; $('#bMotion').classList.toggle('on',!S.motion); }
$('#bMotion').addEventListener('click',()=>{ S.motion=!S.motion; document.body.classList.toggle('nomotion',!S.motion); setMotionBtn(); });
$('#bTeach').addEventListener('click',()=>teacher(!S.teacher)); $('#tClose').addEventListener('click',()=>teacher(false));
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'&&e.target.type!=='range') return;
 if(e.key==='Escape'){ teacher(false); return; } if(S.teacher) return;
 if(e.key==='ArrowLeft'){ e.preventDefault(); step(S.lang==='ar'?1:-1); } if(e.key==='ArrowRight'){ e.preventDefault(); step(S.lang==='ar'?-1:1); } });
let sw=null; const vp=$('#viewport');
vp.addEventListener('pointerdown',e=>{ if(e.target.closest('canvas,input,button,.flap,.opt,.gcell')){ sw=null; return; } sw={x:e.clientX,y:e.clientY}; });
vp.addEventListener('pointerup',e=>{ if(!sw) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y; sw=null; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){ const fwd=S.lang==='ar'?dx>0:dx<0; step(fwd?1:-1); } });
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) voice(null); });

/* ================= init ================= */
document.body.classList.toggle('dark',S.dark); $('#bTheme').textContent=S.dark?'☀':'☾';
readTheme();
labs=[new Lab1(),new Lab2(),new Lab3(),new Lab4(),new Lab5()];
applyI18n(); fit(); placePages(); updateNav();
requestAnimationFrame(loop);
setTimeout(()=>popsUp(true),450);
window.__book={S,go,step,teacher,labs,CH,ROUNDS};
</script>
</body>
